<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/flowers1.png" type="image/x-icon">
    <title>kamu [nama] kah?</title>
    <div class="greetings">
        <span>a</span>
        <span>p</span>
        <span>a</span>
        <span>k</span>
        <span>a</span>
        <span>h</span>
        <span>&nbsp;</span>
        <span>i</span>
        <span>n</span>

        <span>&nbsp;</span>
        <span>.</span>
        <span>.</span>
        <span>.</span>
        <span>.</span>
        <span>.</span>
    </div>

    <div class="description">
        <span>Kalau memang [nama], coba kamu klik tombol ini</span>
    </div>

    <div class="button">
        <button id="loveBtn">
            <a href="flower.html">Klik disini</a>
        </button>
    </div>

    <script>
        // efek fade pas klik sebelum pindah
        document.getElementById("loveBtn").addEventListener("click", function(e){
            e.preventDefault();
            document.body.classList.add("fade-out");
            setTimeout(() => {
                window.location.href = "flower.html";
            }, 600);
        });
    </script>

</body></html>
